<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Formulario Unisalle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Formulario de Contacto universidad de la salle</h1>

        <p>
            Envíanos tu mensaje utilizando el siguiente formulario.
        </p>

    </header>


    <main>

        <form  id="formulario">

            <label for="nombre">
                Nombre
            </label>

            <input
                type="text"
                id="nombre"  required
                placeholder="Ingresa tu nombre"
            >


            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="text"
                id="correo"  required
                placeholder="ejemplo@correo.com"
            >


            <label for="asunto">
                Asunto
            </label>

            <input
                type="text"
                id="asunto"  required
                placeholder="Ingresa el asunto"
            >


            <label for="mensaje">
                Mensaje
            </label>

            <textarea
                id="mensaje"
                placeholder="Escribe tu mensaje"
            ></textarea>


            <button type="submit">
                Enviar
            </button>

        </form>


        <p id="respuesta"></p>

    </main>


    <script src="app.js"></script>


</body>

</html>
